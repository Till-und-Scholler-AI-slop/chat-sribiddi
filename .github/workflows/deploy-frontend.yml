name: Deploy Frontend To VPS

on:
  push:
    branches:
      - main
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  FRONTEND_IMAGE: ghcr.io/till-und-scholler-ai-slop/chat-sribiddi-frontend
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  validate-frontend:
    name: Validate Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Frontend/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Audit dependencies
        run: bun run audit

      - name: Build
        run: bun run build

  build-image:
    name: Build And Push Frontend Image
    needs: validate-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: Frontend/web
          file: Frontend/web/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

  deploy-frontend:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build deploy bundle
        run: |
          set -eu
          mkdir -p dist
          tar -czf dist/frontend-deploy.tar.gz -C Frontend/web deploy

      - name: Prepare remote staging directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -eu
            rm -rf /tmp/chat-sribiddi-deploy-frontend
            mkdir -p /tmp/chat-sribiddi-deploy-frontend

      - name: Upload frontend deploy bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: dist/frontend-deploy.tar.gz
          target: /tmp/chat-sribiddi-deploy-frontend

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          FRONTEND_ENV_FILE: ${{ secrets.FRONTEND_ENV_FILE }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
          DEPLOY_IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 40m
          envs: FRONTEND_ENV_FILE,GHCR_USERNAME,GHCR_READ_TOKEN,DEPLOY_IMAGE_TAG
          script: |
            set -eu
            APP_DIR=/opt/chat-sribiddi
            STAGE_DIR=/tmp/chat-sribiddi-deploy-frontend

            if [ -z "${GHCR_USERNAME:-}" ] || [ -z "${GHCR_READ_TOKEN:-}" ]; then
              echo "GHCR_USERNAME and GHCR_READ_TOKEN secrets are required for private GHCR pulls"
              exit 1
            fi

            FRONTEND_ARCHIVE=$(find "$STAGE_DIR" -type f -name frontend-deploy.tar.gz | head -n 1)

            if [ -z "$FRONTEND_ARCHIVE" ]; then
              echo "Frontend deploy bundle missing in $STAGE_DIR"
              exit 1
            fi

            PREVIOUS_IMAGE_TAG=""
            if [ -f "$APP_DIR/Frontend-web/.env" ]; then
              PREVIOUS_IMAGE_TAG=$(sed -n 's/^IMAGE_TAG=//p' "$APP_DIR/Frontend-web/.env" | tail -n 1)
            fi
            case "$DEPLOY_IMAGE_TAG" in
              sha-*) ;;
              *) echo "Refusing mutable image tag: $DEPLOY_IMAGE_TAG"; exit 1 ;;
            esac

            mkdir -p "$APP_DIR"
            rm -rf "$APP_DIR/Frontend-web"
            mkdir -p "$APP_DIR/Frontend-web"
            tar -xzf "$FRONTEND_ARCHIVE" -C "$APP_DIR/Frontend-web"

            printf '%s\n' "$FRONTEND_ENV_FILE" > "$APP_DIR/Frontend-web/.env"
            tmp_file=$(mktemp)
            grep -v "^IMAGE_TAG=" "$APP_DIR/Frontend-web/.env" > "$tmp_file" || true
            printf 'IMAGE_TAG=%s\n' "$DEPLOY_IMAGE_TAG" >> "$tmp_file"
            mv "$tmp_file" "$APP_DIR/Frontend-web/.env"
            chmod 600 "$APP_DIR/Frontend-web/.env"

            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            cd "$APP_DIR/Frontend-web"
            compose() {
              docker compose --env-file .env -f deploy/docker-compose.prod.yml "$@"
            }
            rollback_frontend() {
              case "$PREVIOUS_IMAGE_TAG" in
                sha-*)
                  echo "Rolling back frontend to $PREVIOUS_IMAGE_TAG"
                  tmp_file=$(mktemp)
                  grep -v '^IMAGE_TAG=' .env > "$tmp_file" || true
                  printf 'IMAGE_TAG=%s\n' "$PREVIOUS_IMAGE_TAG" >> "$tmp_file"
                  mv "$tmp_file" .env
                  compose pull
                  compose up -d --remove-orphans --wait --wait-timeout 180
                  ;;
                *)
                  echo "No immutable previous IMAGE_TAG is available for rollback"
                  ;;
              esac
            }

            compose pull
            if ! compose up -d --remove-orphans --wait --wait-timeout 180; then
              rollback_frontend
              exit 1
            fi
            if ! curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/ >/dev/null; then
              rollback_frontend
              exit 1
            fi
            if ! curl --fail --silent --show-error --max-time 15 https://germinai.de/ >/dev/null; then
              rollback_frontend
              exit 1
            fi

            rm -rf "$STAGE_DIR"
