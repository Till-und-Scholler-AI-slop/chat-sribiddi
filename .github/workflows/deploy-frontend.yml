name: Deploy Frontend To VPS

on:
  push:
    branches:
      - main
    paths:
      - 'Frontend/**'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deploy bundle
        run: |
          set -eu
          mkdir -p dist
          if [ -d Frontend/web ]; then
            FRONTEND_DIR=Frontend/web
          elif [ -d Frontend/Web ]; then
            FRONTEND_DIR=Frontend/Web
          else
            echo "Frontend directory not found (expected Frontend/web or Frontend/Web)"
            exit 1
          fi
          tar -czf dist/frontend-web.tar.gz -C "$FRONTEND_DIR" .

      - name: Prepare remote staging directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          script: |
            set -eu
            mkdir -p /tmp/chat-sribiddi-deploy-frontend

      - name: Upload frontend bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: dist/frontend-web.tar.gz
          target: /tmp/chat-sribiddi-deploy-frontend

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          FRONTEND_ENV_FILE: ${{ secrets.FRONTEND_ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          command_timeout: 40m
          envs: FRONTEND_ENV_FILE
          script: |
            set -eu
            APP_DIR=/opt/chat-sribiddi
            STAGE_DIR=/tmp/chat-sribiddi-deploy-frontend

            FRONTEND_ARCHIVE=$(find "$STAGE_DIR" -type f -name frontend-web.tar.gz | head -n 1)

            if [ -z "$FRONTEND_ARCHIVE" ]; then
              echo "Frontend bundle missing in $STAGE_DIR"
              exit 1
            fi

            rm -rf "$APP_DIR/Frontend-web"
            mkdir -p "$APP_DIR/Frontend-web"
            tar -xzf "$FRONTEND_ARCHIVE" -C "$APP_DIR/Frontend-web"

            printf '%s\n' "$FRONTEND_ENV_FILE" > "$APP_DIR/Frontend-web/.env"
            chmod 600 "$APP_DIR/Frontend-web/.env"

            cd "$APP_DIR/Frontend-web"
            docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --build --remove-orphans

            rm -rf "$STAGE_DIR"
