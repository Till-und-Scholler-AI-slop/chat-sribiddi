name: Deploy Backend To VPS

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - 'infra/caddy/**'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  validate-backend:
    name: Validate Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile
        run: ./gradlew compileJava

      - name: Run tests
        run: ./gradlew test

  deploy-backend:
    needs: validate-backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build deploy bundles
        run: |
          set -eu
          mkdir -p dist
          tar -czf dist/backend.tar.gz Backend
          tar -czf dist/caddy.tar.gz -C infra/caddy .

      - name: Prepare remote staging directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          script: |
            set -eu
            mkdir -p /tmp/chat-sribiddi-deploy-backend

      - name: Upload backend bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: dist/backend.tar.gz
          target: /tmp/chat-sribiddi-deploy-backend

      - name: Upload caddy bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: dist/caddy.tar.gz
          target: /tmp/chat-sribiddi-deploy-backend

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          command_timeout: 40m
          envs: BACKEND_ENV_FILE
          script: |
            set -eu
            APP_DIR=/opt/chat-sribiddi
            STAGE_DIR=/tmp/chat-sribiddi-deploy-backend

            BACKEND_ARCHIVE=$(find "$STAGE_DIR" -type f -name backend.tar.gz | head -n 1)
            CADDY_ARCHIVE=$(find "$STAGE_DIR" -type f -name caddy.tar.gz | head -n 1)

            if [ -z "$BACKEND_ARCHIVE" ]; then
              echo "Backend bundle missing in $STAGE_DIR"
              exit 1
            fi

            rm -rf "$APP_DIR/Backend"
            tar -xzf "$BACKEND_ARCHIVE" -C "$APP_DIR"

            if [ -n "$CADDY_ARCHIVE" ]; then
              mkdir -p "$APP_DIR/infra/caddy"
              tar -xzf "$CADDY_ARCHIVE" -C "$APP_DIR/infra/caddy"
            fi

            printf '%s\n' "$BACKEND_ENV_FILE" > "$APP_DIR/Backend/.env"
            chmod 600 "$APP_DIR/Backend/.env"

            cd "$APP_DIR/Backend"
            docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --build --remove-orphans

            if [ -n "$CADDY_ARCHIVE" ] && [ -f "$APP_DIR/infra/caddy/Caddyfile" ]; then
              caddy validate --config "$APP_DIR/infra/caddy/Caddyfile"
              cp "$APP_DIR/infra/caddy/Caddyfile" /etc/caddy/Caddyfile
              systemctl reload caddy || systemctl restart caddy
            fi

            rm -rf "$STAGE_DIR"
