name: Deploy Backend To VPS

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - 'ProviderGateway/**'
      - 'infra/caddy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

env:
  BACKEND_IMAGE: ghcr.io/till-und-scholler-ai-slop/chat-sribiddi-backend
  PROVIDER_GATEWAY_IMAGE: ghcr.io/till-und-scholler-ai-slop/chat-sribiddi-provider-gateway
  IMAGE_TAG: main

jobs:
  validate-backend:
    name: Validate Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  validate-provider-gateway:
    name: Validate ProviderGateway Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ProviderGateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ProviderGateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  build-images:
    name: Build And Push Backend Images
    needs:
      - validate-backend
      - validate-provider-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          file: Backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}

      - name: Build and push ProviderGateway image
        uses: docker/build-push-action@v6
        with:
          context: ProviderGateway
          file: ProviderGateway/Dockerfile.prod
          push: true
          tags: |
            ${{ env.PROVIDER_GATEWAY_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.PROVIDER_GATEWAY_IMAGE }}:sha-${{ github.sha }}

  deploy-backend:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build deploy bundles
        run: |
          set -eu
          mkdir -p dist
          tar -czf dist/backend-deploy.tar.gz Backend/deploy Backend/src/main/resources/db/migration
          tar -czf dist/caddy.tar.gz -C infra/caddy .

      - name: Prepare remote staging directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          script: |
            set -eu
            rm -rf /tmp/chat-sribiddi-deploy-backend
            mkdir -p /tmp/chat-sribiddi-deploy-backend

      - name: Upload backend deploy bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: dist/backend-deploy.tar.gz
          target: /tmp/chat-sribiddi-deploy-backend

      - name: Upload caddy bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: dist/caddy.tar.gz
          target: /tmp/chat-sribiddi-deploy-backend

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          command_timeout: 40m
          envs: BACKEND_ENV_FILE,OPENROUTER_API_KEY,GHCR_USERNAME,GHCR_READ_TOKEN
          script: |
            set -eu
            APP_DIR=/opt/chat-sribiddi
            STAGE_DIR=/tmp/chat-sribiddi-deploy-backend

            if [ -z "${GHCR_USERNAME:-}" ] || [ -z "${GHCR_READ_TOKEN:-}" ]; then
              echo "GHCR_USERNAME and GHCR_READ_TOKEN secrets are required for private GHCR pulls"
              exit 1
            fi

            BACKEND_ARCHIVE=$(find "$STAGE_DIR" -type f -name backend-deploy.tar.gz | head -n 1)
            CADDY_ARCHIVE=$(find "$STAGE_DIR" -type f -name caddy.tar.gz | head -n 1)

            if [ -z "$BACKEND_ARCHIVE" ]; then
              echo "Backend deploy bundle missing in $STAGE_DIR"
              exit 1
            fi

            mkdir -p "$APP_DIR"
            rm -rf "$APP_DIR/Backend"
            tar -xzf "$BACKEND_ARCHIVE" -C "$APP_DIR"

            if [ -n "$CADDY_ARCHIVE" ]; then
              mkdir -p "$APP_DIR/infra/caddy"
              tar -xzf "$CADDY_ARCHIVE" -C "$APP_DIR/infra/caddy"
            fi

            printf '%s\n' "$BACKEND_ENV_FILE" > "$APP_DIR/Backend/.env"
            set_env_var() {
              key="$1"
              value="$2"
              tmp_file=$(mktemp)
              grep -v "^${key}=" "$APP_DIR/Backend/.env" > "$tmp_file" || true
              printf '%s=%s\n' "$key" "$value" >> "$tmp_file"
              mv "$tmp_file" "$APP_DIR/Backend/.env"
            }
            set_env_var_if_present() {
              key="$1"
              value="$2"
              if [ -z "$value" ]; then
                return 0
              fi
              set_env_var "$key" "$value"
            }
            set_env_var_if_present OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
            set_env_var IMAGE_TAG "main"
            set_env_var PROVIDER_GATEWAY_ENABLED "true"
            set_env_var PROVIDER_GATEWAY_BASE_URL "http://provider-gateway:8095"
            set_env_var OPENAI_CODEX_SUBSCRIPTION_ENABLED "true"
            set_env_var CODEX_CLI_BINARY "codex"
            set_env_var CODEX_CONNECTIONS_ROOT "/var/lib/chat-sribiddi/codex-connections"
            set_env_var GROK_CLI_ENABLED "true"
            set_env_var GROK_CLI_BIN "grok"
            set_env_var GROK_CLI_SESSIONS_DIR "/var/lib/chat-sribiddi/grok-sessions"
            chmod 600 "$APP_DIR/Backend/.env"

            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            cd "$APP_DIR/Backend"
            docker compose --env-file .env -f deploy/docker-compose.prod.yml pull
            docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --remove-orphans

            if [ -n "$CADDY_ARCHIVE" ] && [ -f "$APP_DIR/infra/caddy/Caddyfile" ]; then
              caddy validate --config "$APP_DIR/infra/caddy/Caddyfile"
              cp "$APP_DIR/infra/caddy/Caddyfile" /etc/caddy/Caddyfile
              systemctl reload caddy || systemctl restart caddy
            fi

            rm -rf "$STAGE_DIR"
