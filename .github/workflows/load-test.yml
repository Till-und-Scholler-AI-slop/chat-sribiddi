name: Deterministic load and soak test

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Test profile
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - soak
      soak_duration:
        description: k6 duration used only for the soak profile
        required: false
        default: 10m
        type: string
      soak_vus:
        description: Concurrent sessions used only for the soak profile
        required: false
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-sse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: http://127.0.0.1:18080
      PROVIDER_STATS_URL: http://127.0.0.1:18081
      LOAD_COMPOSE: Backend/src/test/k6/docker-compose.load.yml
      TEST_MODE: ${{ github.event.inputs.mode || 'baseline' }}
      SOAK_DURATION: ${{ github.event.inputs.soak_duration || '10m' }}
      SOAK_VUS: ${{ github.event.inputs.soak_vus || '100' }}
      K6_VUS: "100"
      K6_ITERATIONS_PER_VU: "10"
      NO_PROXY: 127.0.0.1,localhost

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "1.7.1"

      - name: Validate deterministic stack
        shell: bash
        run: docker compose -f "$LOAD_COMPOSE" config --quiet

      - name: Build and start real load-test stack
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose -f "$LOAD_COMPOSE" up \
            -d \
            --build \
            --wait \
            --wait-timeout 240
          curl --fail --silent --show-error "$BASE_URL/health/ready" > artifacts/readiness.json
          curl --fail --silent --show-error "$PROVIDER_STATS_URL/health" > artifacts/provider-health.json

      - name: Run deterministic k6 profile
        id: k6
        continue-on-error: true
        shell: bash
        run: |
          k6 run \
            --summary-export artifacts/k6-summary.json \
            Backend/src/test/k6/byok-load-test.js

      - name: Capture real stack state
        if: always()
        shell: bash
        run: |
          curl --fail --silent --show-error "$PROVIDER_STATS_URL/__test/stats" > artifacts/provider-stats.json || true
          curl --fail --silent --show-error \
            -H 'Authorization: Bearer load-test-metrics' \
            "$BASE_URL/internal/metrics" > artifacts/backend-metrics.prom || true
          docker compose -f "$LOAD_COMPOSE" ps --all > artifacts/compose-ps.txt || true
          docker compose -f "$LOAD_COMPOSE" logs --no-color > artifacts/stack.log 2>&1 || true
          docker compose -f "$LOAD_COMPOSE" exec -T db \
            psql -U load_test -d chat_sribiddi -Atc \
            "select json_build_object('streamingMessages', (select count(*) from messages where status = 'STREAMING'), 'processingJobs', (select count(*) from document_jobs where status = 'PROCESSING'));" \
            > artifacts/database-drain.json 2>&1 || true
          {
            echo "## Deterministic full-stack SSE load gate"
            echo
            echo "Profile: \`$TEST_MODE\`"
            echo
            echo "The gate runs the real Backend and ProviderGateway with PostgreSQL 18 and Redis."
            echo "Only the external OpenRouter-compatible provider is deterministic and local."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop deterministic stack
        if: always()
        shell: bash
        run: docker compose -f "$LOAD_COMPOSE" down --volumes --remove-orphans --timeout 30

      - name: Upload load-test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce k6 result after artifact upload
        if: steps.k6.outcome == 'failure'
        shell: bash
        run: exit 1
