name: Create UX Improvement Issues

on:
  # Allows the repo owner to trigger this one-time script manually from the
  # GitHub Actions tab: Actions → "Create UX Improvement Issues" → Run workflow
  workflow_dispatch:

jobs:
  create-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Create UX improvement GitHub issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x .github/scripts/create-ux-issues.sh
          .github/scripts/create-ux-issues.sh
