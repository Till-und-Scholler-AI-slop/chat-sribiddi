<section class="page">
  <mat-card class="page-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title class="page-title">Welcome to your Angular app</mat-card-title>
      <mat-card-subtitle class="page-subtitle">Starter page</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p class="page-lead">
        This is the first screen. Use the button below to navigate to the next page.
      </p>
    </mat-card-content>
    <mat-card-actions class="page-actions" align="start">
      <a mat-flat-button color="primary" routerLink="/next">Go to the next page</a>
    </mat-card-actions>
  </mat-card>
</section>
