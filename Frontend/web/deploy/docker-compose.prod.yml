name: chat_sribiddi_frontend

services:
  frontend:
    image: ghcr.io/till-und-scholler-ai-slop/chat-sribiddi-frontend:${IMAGE_TAG:-main}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:3000:3000"
