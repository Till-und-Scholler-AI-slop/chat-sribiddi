name: chat_sribiddi_frontend

services:
  frontend:
    image: ghcr.io/till-und-scholler-ai-slop/chat-sribiddi-frontend:${IMAGE_TAG:?IMAGE_TAG must be an immutable sha-* tag}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
