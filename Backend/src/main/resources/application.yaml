server:
  # Required when running behind reverse proxies (Caddy/Nginx) so OAuth redirects use https.
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30d}
      cookie:
        max-age: ${SESSION_COOKIE_MAX_AGE:${SESSION_TIMEOUT:30d}}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:20000}

spring:
  lifecycle:
    # Raised to 10 min to allow in-flight SSE streams to finish during rolling deployments.
    # Pro AI models can reason for 10+ minutes; a shorter window would sever active streams.
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:600s}
  application:
    name: chat-sribiddi
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:0}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  threads:
    virtual:
      enabled: true
  autoconfigure:
    # Provider clients are created lazily per request in DefaultProviderClientFactory.
    # Disable Spring AI model auto-config so startup works without server-wide API keys.
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:production}
  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
          google-drive:
            provider: google
            client-id: ${GOOGLE_CONNECTOR_CLIENT_ID:${GOOGLE_CLIENT_ID}}
            client-secret: ${GOOGLE_CONNECTOR_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET}}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - https://www.googleapis.com/auth/drive.file
          google-gmail:
            provider: google
            client-id: ${GOOGLE_CONNECTOR_CLIENT_ID:${GOOGLE_CLIENT_ID}}
            client-secret: ${GOOGLE_CONNECTOR_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET}}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - https://www.googleapis.com/auth/gmail.readonly
          google-calendar:
            provider: google
            client-id: ${GOOGLE_CONNECTOR_CLIENT_ID:${GOOGLE_CLIENT_ID}}
            client-secret: ${GOOGLE_CONNECTOR_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET}}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - https://www.googleapis.com/auth/calendar.calendarlist.readonly
              - https://www.googleapis.com/auth/calendar.events.readonly
              - https://www.googleapis.com/auth/calendar.freebusy

  docker:
    compose:
      enabled: true
      file: compose.yaml

  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    baseline-on-migrate: true

  ai:
    chat:
      client:
        enabled: false
        tool-calling:
          stream-tool-call-responses: true
    openai:
      api-key: ${OPENAI_API_KEY:}

    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        project-id: ${GOOGLE_PROJECT_ID:demo-project}
        location: ${GOOGLE_LOCATION:us-central1}

    anthropic:
      api-key: ${CLAUDE_API_KEY:}

encryption:
  # Base64-encoded 256-bit secret for encrypting stored user API keys.
  secret: ${ENCRYPTION_SECRET}
  # Version assigned to newly stored keys.
  active-key-version: ${ENCRYPTION_ACTIVE_KEY_VERSION:1}
  # Optional comma-separated `version:base64Secret` entries for decrypting older versions.
  decryption-secrets: ${ENCRYPTION_DECRYPTION_SECRETS:}

ai:
  models:
    featured:
      openai:
        - gpt-5.5-2026-04-23
        - gpt-5.4-2026-03-05
        - gpt-5.4-mini-2026-03-17
        - gpt-5.4-nano-2026-03-17
      google:
        - gemini-3.1-pro-preview
        - gemini-3.1-flash-lite-preview
      claude:
        - claude-sonnet-4-6-20260215
        - claude-opus-4-6-20260215
        - claude-haiku-4-5-20251001
      openrouter:
        - openrouter/free
    openai:
      - id: gpt-5.5-2026-04-23
        label: GPT-5.5
      - id: gpt-5.4-2026-03-05
        label: GPT-5.2 Mini
      - id: gpt-5.4-mini-2026-03-17
        label: GPT-5.4 mini
      - id: gpt-5.4-nano-2026-03-17
        label: GPT-5.4 Nano
    google:
      - id: gemini-3.1-pro-preview
        label: Gemini 3.1 Pro
      - id: gemini-3.1-flash-lite-preview
        label: Gemini 3.1 Flash Lite
    claude:
      - id: claude-opus-4-6-20260215
        label: Claude Opus 4.6
      - id: claude-sonnet-4-6-20260215
        label: Claude Sonnet 4.6
      - id: claude-haiku-4-5-20251001
        label: Claude Haiku 4.5
      - id: claude-sonnet-4-20250514
        label: Claude Sonnet 4
      - id: claude-3-5-haiku-20241022
        label: Claude 3.5 Haiku
    openrouter:
      - id: openrouter/free
        label: OpenRouter Free
        prompt-price: "0"
        completion-price: "0"
      - id: openrouter/auto
        label: OpenRouter Auto

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  chat:
    context-message-limit: ${CHAT_CONTEXT_MESSAGE_LIMIT:20}
    message-page-size: ${CHAT_MESSAGE_PAGE_SIZE:50}
    chat-page-size: ${CHAT_PAGE_SIZE:50}
    max-media-attachments: ${CHAT_MAX_MEDIA_ATTACHMENTS:5}
    max-media-attachment-bytes: ${CHAT_MAX_MEDIA_ATTACHMENT_BYTES:5242880}   # 5 MB
    max-media-total-bytes: ${CHAT_MAX_MEDIA_TOTAL_BYTES:20971520}           # 20 MB
    stream-timeout-ms: ${CHAT_STREAM_TIMEOUT_MS:1800000}                     # 30 min
    tool-disabled-model-patterns:
      - google:gemma-*
      - openrouter:venice/*
      - openrouter:*venice*uncensored*
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    backend: ${RATE_LIMIT_BACKEND:redis}
    anonymous-requests-per-minute: ${RATE_LIMIT_ANONYMOUS_PER_MINUTE:300}
    free-requests-per-minute: ${RATE_LIMIT_FREE_PER_MINUTE:600}
    premium-requests-per-minute: ${RATE_LIMIT_PREMIUM_PER_MINUTE:1200}
    max-requests-per-minute: ${RATE_LIMIT_MAX_PER_MINUTE:2400}
    bucket-ttl: ${RATE_LIMIT_BUCKET_TTL:10m}
    redis-failure-retry-after-seconds: ${RATE_LIMIT_REDIS_FAILURE_RETRY_AFTER_SECONDS:60}
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:127.0.0.1,::1}
  ai:
    openai:
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:10s}
      read-timeout: ${OPENAI_READ_TIMEOUT:1200s}
    google:
      timeout: ${GOOGLE_TIMEOUT:120s}
    model-catalog:
      connect-timeout: ${MODEL_CATALOG_CONNECT_TIMEOUT:5s}
      read-timeout: ${MODEL_CATALOG_READ_TIMEOUT:15s}
    openrouter:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      model-catalog-url: ${OPENROUTER_MODEL_CATALOG_URL:https://openrouter.ai/api/v1/models}
      allowed-model-catalog-hosts: ${OPENROUTER_ALLOWED_MODEL_CATALOG_HOSTS:openrouter.ai}
      # Attribution headers sent with every OpenRouter request (HTTP-Referer, X-Title). Required
      # by OpenRouter so requests show up under the correct integrating app on their dashboard.
      app-name: ${OPENROUTER_APP_NAME:chat-sribiddi}
      referrer: ${OPENROUTER_REFERRER:${APP_FRONTEND_URL:https://chat-sribiddi.local}}
  tools:
    user-agent: ${TOOLS_USER_AGENT:ChatSribiddi/1.0 (Tool)}
    python-enabled: ${TOOLS_PYTHON_ENABLED:false}
    credentials:
      openai-image-api-key: ${OPENAI_IMAGE_API_KEY:${OPENAI_API_KEY:}}
      openai-image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
      github-token: ${GITHUB_TOOL_TOKEN:}
      github-client-id: ${GITHUB_TOOL_CLIENT_ID:}
      github-client-secret: ${GITHUB_TOOL_CLIENT_SECRET:}
      github-redirect-uri: ${GITHUB_TOOL_REDIRECT_URI:http://localhost:8080/tool-credentials/github/oauth/callback}
    python-sandbox:
      docker-binary: ${TOOLS_PYTHON_DOCKER_BINARY:docker}
      image: ${TOOLS_PYTHON_IMAGE:python:3.13-alpine}
      timeout: ${TOOLS_PYTHON_TIMEOUT:10s}
      max-output-bytes: ${TOOLS_PYTHON_MAX_OUTPUT_BYTES:10240}
      max-code-length: ${TOOLS_PYTHON_MAX_CODE_LENGTH:10000}
      memory: ${TOOLS_PYTHON_MEMORY:128m}
      cpus: ${TOOLS_PYTHON_CPUS:0.5}
      pids-limit: ${TOOLS_PYTHON_PIDS_LIMIT:64}
      tmpfs: ${TOOLS_PYTHON_TMPFS:/tmp:rw,noexec,nosuid,size=16m}
  web-search:
    api-key: ${BRAVE_SEARCH_API_KEY:}
    max-results: ${WEB_SEARCH_MAX_RESULTS:5}
    request-timeout: ${WEB_SEARCH_REQUEST_TIMEOUT:10s}
    user-agent: ${WEB_SEARCH_USER_AGENT:ChatSribiddi/1.0 (WebSearch)}
  connectors:
    google:
      picker-developer-key: ${GOOGLE_PICKER_DEVELOPER_KEY:}
      picker-app-id: ${GOOGLE_PICKER_APP_ID:}
      gmail-enabled: ${GOOGLE_GMAIL_CONNECTOR_ENABLED:false}
  billing:
    guest-daily-cap: ${BILLING_GUEST_DAILY_CAP:20}
    # Per-tier entitlements. Values are consumed by BillingProperties / EntitlementService.
    # Model access is NOT gated via hardcoded ID whitelists — it uses the price threshold
    # defined under `model-access` below (see MONETIZATION_PLAN.md).
    stripe:
      # Server-side Stripe API key. Blank in dev disables the /billing/checkout-session and
      # /billing/portal-session endpoints at the Stripe SDK boundary (they will return 503).
      secret-key: ${STRIPE_SECRET_KEY:}
      # Webhook signing secret (used by the BILL-10 webhook controller; included here so that
      # the full `app.billing.stripe.*` namespace lives in one place per issue spec).
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      # Stripe Price IDs for each (plan, interval) combination. Configure in the Stripe dashboard
      # (Products → Pricing) and supply via environment variables in deployment.
      price-id-premium-month: ${STRIPE_PRICE_ID_PREMIUM_MONTH:}
      price-id-premium-year: ${STRIPE_PRICE_ID_PREMIUM_YEAR:}
      price-id-max-month: ${STRIPE_PRICE_ID_MAX_MONTH:}
      price-id-max-year: ${STRIPE_PRICE_ID_MAX_YEAR:}
      # Redirect targets for Stripe Checkout and Customer Portal. Defaults append sensible paths
      # to the configured frontend URL.
      success-url: ${STRIPE_SUCCESS_URL:${APP_FRONTEND_URL:http://localhost:3000}/billing/success?session_id={CHECKOUT_SESSION_ID}}
      cancel-url: ${STRIPE_CANCEL_URL:${APP_FRONTEND_URL:http://localhost:3000}/billing/cancel}
      portal-return-url: ${STRIPE_PORTAL_RETURN_URL:${APP_FRONTEND_URL:http://localhost:3000}/settings}
    managed-keys:
      # Server-side API keys used by BillingModeResolver when a request is resolved to
      # managed billing mode. Defaults read the conventional env vars — a blank value disables
      # managed mode for that provider.
      openai: ${OPENAI_API_KEY:}
      google: ${GOOGLE_API_KEY:}
      claude: ${CLAUDE_API_KEY:}
      openrouter: ${OPENROUTER_API_KEY:}
    model-access:
      # Free tier allows only OpenRouter's free router model (`openrouter/free`) in managed mode
      # unless the user stores a BYOK provider key. The thresholds still define the zero-cost
      # price cap for that model and any future free-router equivalents.
      free-max-input-usd-per-million: ${BILLING_FREE_MAX_INPUT_USD_PER_MILLION:0.0}
      free-max-output-usd-per-million: ${BILLING_FREE_MAX_OUTPUT_USD_PER_MILLION:0.0}
      # Premium tier allows all models under these thresholds (USD per 1,000,000 tokens). Models
      # above the threshold — e.g. claude-opus-4-7 (~$15/$75 per 1M) — require Max. BILL-8.
      premium-max-input-usd-per-million: ${BILLING_PREMIUM_MAX_INPUT_USD_PER_MILLION:5.0}
      premium-max-output-usd-per-million: ${BILLING_PREMIUM_MAX_OUTPUT_USD_PER_MILLION:5.0}
      # Providers that may be used in managed (platform-paid) billing mode. Paid tiers route 100%
      # through OpenRouter, so direct OpenAI/Google/Claude are BYOK-only.
      managed-providers:
        - OPENROUTER
    tiers:
      free:
        max-attachments: 2
        max-attachment-bytes: 2097152        # 2 MB
        max-total-attachment-bytes: 4194304  # 4 MB
        context-message-limit: 10
        tools: []
        daily-cap: 50
        parallel-streams: 1
      premium:
        max-attachments: 5
        max-attachment-bytes: 5242880        # 5 MB
        max-total-attachment-bytes: 20971520 # 20 MB
        context-message-limit: 20
        tools:
          - brave-search
          - image-generation
          - github-issue-search
          - chart-generator
          - document-analysis
          - agent-plan
          - google-drive
          - gmail-search
          - calendar-list-events
          - calendar-freebusy
          - spreadsheet-analysis
          - web-research
        daily-cap: 500
        parallel-streams: 2
      max:
        max-attachments: 10
        max-attachment-bytes: 10485760       # 10 MB
        max-total-attachment-bytes: 52428800 # 50 MB
        context-message-limit: 40
        tools:
          - "*"
        daily-cap: 2000
        parallel-streams: 4
