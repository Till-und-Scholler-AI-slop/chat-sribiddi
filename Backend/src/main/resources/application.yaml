server:
  # Required when running behind reverse proxies (Caddy/Nginx) so OAuth redirects use https.
  forward-headers-strategy: framework

spring:
  application:
    name: chat-sribiddi
  autoconfigure:
    # Provider clients are created lazily per request in DefaultProviderClientFactory.
    # Disable Spring AI model auto-config so startup works without server-wide API keys.
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:production}
  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

  docker:
    compose:
      enabled: true
      file: compose.yaml

  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    baseline-on-migrate: true

  ai:
    chat:
      client:
        enabled: false
    openai:
      api-key: ${OPENAI_API_KEY:}

    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        project-id: ${GOOGLE_PROJECT_ID:demo-project}
        location: ${GOOGLE_LOCATION:us-central1}

encryption:
  # Base64-encoded 256-bit secret for encrypting stored user API keys.
  secret: ${ENCRYPTION_SECRET}
  # Version assigned to newly stored keys.
  active-key-version: ${ENCRYPTION_ACTIVE_KEY_VERSION:1}
  # Optional comma-separated `version:base64Secret` entries for decrypting older versions.
  decryption-secrets: ${ENCRYPTION_DECRYPTION_SECRETS:}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  ai:
    openai:
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:10s}
      read-timeout: ${OPENAI_READ_TIMEOUT:180s}
