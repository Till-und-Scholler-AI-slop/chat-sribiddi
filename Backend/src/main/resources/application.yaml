server:
  # Required when running behind reverse proxies (Caddy/Nginx) so OAuth redirects use https.
  forward-headers-strategy: framework

spring:
  application:
    name: chat-sribiddi
  autoconfigure:
    # Provider clients are created lazily per request in DefaultProviderClientFactory.
    # Disable Spring AI model auto-config so startup works without server-wide API keys.
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:production}
  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

  docker:
    compose:
      enabled: true
      file: compose.yaml

  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    baseline-on-migrate: true

  ai:
    chat:
      client:
        enabled: false
    openai:
      api-key: ${OPENAI_API_KEY:}

    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        project-id: ${GOOGLE_PROJECT_ID:demo-project}
        location: ${GOOGLE_LOCATION:us-central1}

    anthropic:
      api-key: ${CLAUDE_API_KEY:}

encryption:
  # Base64-encoded 256-bit secret for encrypting stored user API keys.
  secret: ${ENCRYPTION_SECRET}
  # Version assigned to newly stored keys.
  active-key-version: ${ENCRYPTION_ACTIVE_KEY_VERSION:1}
  # Optional comma-separated `version:base64Secret` entries for decrypting older versions.
  decryption-secrets: ${ENCRYPTION_DECRYPTION_SECRETS:}

ai:
  models:
    openai:
      - id: gpt-5.2
        label: GPT-5.2
      - id: gpt-5.2-mini
        label: GPT-5.2 Mini
      - id: gpt-5.2-nano
        label: GPT-5.2 Nano
      - id: gpt-4.1-2025-04-14
        label: GPT-4.1
      - id: gpt-4.1-mini-2025-04-14
        label: GPT-4.1 Mini
      - id: gpt-4.1-nano-2025-04-14
        label: GPT-4.1 Nano
      - id: o3-2025-04-16
        label: o3
      - id: o4-mini-2025-04-16
        label: o4-mini
    google:
      - id: gemini-3.1-pro-preview
        label: Gemini 3.1 Pro
      - id: gemini-3.1-flash-lite-preview
        label: Gemini 3.1 Flash Lite
      - id: gemini-3-flash
        label: Gemini 3 Flash
      - id: gemini-3-pro
        label: Gemini 3 Pro
      - id: gemini-2.5-pro-preview-05-06
        label: Gemini 2.5 Pro
      - id: gemini-2.5-flash-preview-05-20
        label: Gemini 2.5 Flash
      - id: gemini-2.0-flash
        label: Gemini 2.0 Flash
      - id: gemini-2.0-flash-lite
        label: Gemini 2.0 Flash Lite
    claude:
      - id: claude-opus-4-6-20260215
        label: Claude Opus 4.6
      - id: claude-sonnet-4-6-20260215
        label: Claude Sonnet 4.6
      - id: claude-haiku-4-5-20251001
        label: Claude Haiku 4.5
      - id: claude-sonnet-4-20250514
        label: Claude Sonnet 4
      - id: claude-3-5-haiku-20241022
        label: Claude 3.5 Haiku
    openrouter:
      - id: openrouter/auto
        label: OpenRouter Auto
      - id: openai/gpt-4o-mini
        label: GPT-4o Mini
      - id: anthropic/claude-3.5-sonnet
        label: Claude 3.5 Sonnet

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  chat:
    context-message-limit: ${CHAT_CONTEXT_MESSAGE_LIMIT:20}
    message-page-size: ${CHAT_MESSAGE_PAGE_SIZE:50}
    max-media-attachments: ${CHAT_MAX_MEDIA_ATTACHMENTS:5}
    max-media-attachment-bytes: ${CHAT_MAX_MEDIA_ATTACHMENT_BYTES:5242880}   # 5 MB
    max-media-total-bytes: ${CHAT_MAX_MEDIA_TOTAL_BYTES:20971520}           # 20 MB
    stream-timeout-ms: ${CHAT_STREAM_TIMEOUT_MS:600000}                     # 10 min
  ai:
    openai:
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:10s}
      read-timeout: ${OPENAI_READ_TIMEOUT:180s}
    openrouter:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      completions-path: ${OPENROUTER_COMPLETIONS_PATH:/chat/completions}
      model-catalog-url: ${OPENROUTER_MODEL_CATALOG_URL:https://openrouter.ai/api/v1/models}
