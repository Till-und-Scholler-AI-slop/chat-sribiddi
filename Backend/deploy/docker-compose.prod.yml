name: chat_sribiddi_backend

services:
  db:
    image: postgres:18-alpine3.22
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB:-chat_sribiddi}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.1-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:11-alpine
    restart: "no"
    env_file:
      - ../.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        flyway
        -url=jdbc:postgresql://db:5432/$${POSTGRES_DB:-chat_sribiddi}
        -user="$${POSTGRES_USER}"
        -password="$${POSTGRES_PASSWORD}"
        -connectRetries=60
        migrate
    volumes:
      - ../src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    image: chat-sribiddi-backend:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
