name: chat_sribiddi_backend

services:
  db:
    image: postgres:18-alpine3.22
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB:-chat_sribiddi}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.1-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:11-alpine
    restart: "no"
    env_file:
      - ../.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        flyway
        -url=jdbc:postgresql://db:5432/$${POSTGRES_DB:-chat_sribiddi}
        -user="$${POSTGRES_USER}"
        -password="$${POSTGRES_PASSWORD}"
        -connectRetries=60
        migrate
    volumes:
      - ../src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ghcr.io/till-und-scholler-ai-slop/chat-sribiddi-backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    volumes:
      - codex_connections:/var/lib/chat-sribiddi/codex-connections
      - grok_sessions:/var/lib/chat-sribiddi/grok-sessions
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      provider-gateway:
        condition: service_healthy

  provider-gateway:
    image: ghcr.io/till-und-scholler-ai-slop/chat-sribiddi-provider-gateway:${IMAGE_TAG:-main}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      NODE_ENV: production
      PROVIDER_GATEWAY_HOST: 0.0.0.0
      PROVIDER_GATEWAY_PORT: 8095
      CODEX_CLI_BINARY: ${CODEX_CLI_BINARY:-codex}
      CODEX_EXEC_TIMEOUT_MS: ${CODEX_EXEC_TIMEOUT_MS:-300000}
    expose:
      - "8095"
    volumes:
      - codex_connections:/var/lib/chat-sribiddi/codex-connections
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8095/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      DOCKER_CONFIG: /
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro

volumes:
  postgres_data:
  codex_connections:
  grok_sessions:
