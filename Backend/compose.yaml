services:
  db:
    image: postgres:17-alpine
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat_sribiddi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chat_sribiddi}"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes: ["db:/var/lib/postgresql/data"]

  redis:
    image: redis:8.6.1-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:11-alpine
    command:
      - -url=jdbc:postgresql://db:5432/${POSTGRES_DB:-chat_sribiddi}
      - -user=${POSTGRES_USER:-postgres}
      - -password=${POSTGRES_PASSWORD:-postgres}
      - -connectRetries=60
      - migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-chat_sribiddi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  db:
    driver: local
